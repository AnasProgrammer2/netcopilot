name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Release from the Actions tab (or the API) without pushing a tag locally:
  # the tag is created on the selected branch's head. It must match the
  # version in package.json.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.17.0 (must match package.json)'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Create the GitHub Release first (as a DRAFT) so build jobs don't race each
  # other and users / auto-update never see a release with missing assets.
  # It is published by the `publish-release` job once every platform succeeds.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Manual run: check the tag against package.json, then create it here.
      # (A tag pushed with GITHUB_TOKEN does not start another workflow run.)
      - name: Create tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json ($version)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists"; exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "NetCopilot ${RELEASE_TAG#v}"
          git push origin "refs/tags/$RELEASE_TAG"

      # Hand-written notes in docs/releases/<tag>.md lead the release body;
      # GitHub's generated changelog is appended below them.
      - name: Release notes
        id: notes
        run: |
          f="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else : > /tmp/notes.md; echo "path=/tmp/notes.md" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_cmd: npm run build && npx electron-builder --mac --x64 --arm64 --publish always
          - os: windows-2022
            platform: win
            build_cmd: npm run build && npx electron-builder --win --publish always
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run build && npx electron-builder --linux --publish always

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Linux — native build dependencies
      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libusb-1.0-0-dev \
            build-essential \
            python3 \
            libarchive-tools \
            rpm \
            fakeroot \
            libopenjp2-tools \
            libsecret-1-dev

      # windows-latest ships VS 18 which @electron/node-gyp cannot detect yet.
      # Pin windows-2022 and load MSVC before compiling native modules.
      - name: Setup Windows build tools
        if: matrix.platform == 'win'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        env:
          GYP_MSVS_VERSION: ${{ matrix.platform == 'win' && '2022' || '' }}
        run: npm ci

      - name: Typecheck & test
        run: npm run typecheck && npm run test

      # ── macOS code signing ────────────────────────────────────────────────────
      # Requires repository secrets:
      #   APPLE_CERTIFICATE          — base64-encoded .p12 certificate
      #   APPLE_CERTIFICATE_PASSWORD — password for the .p12
      #   APPLE_TEAM_ID              — your Apple Developer Team ID
      #   APPLE_ID                   — Apple ID for notarization
      #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password for notarization
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        shell: bash
        env:
          _APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$_APPLE_CERTIFICATE" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
            echo "$_APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security import /tmp/certificate.p12 -k build.keychain \
              -P "$_APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security list-keychains -d user -s build.keychain login.keychain
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            rm /tmp/certificate.p12
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> $GITHUB_ENV
            echo "✓ Developer ID certificate imported — full signing + notarization enabled."
          else
            echo "CSC_IDENTITY=-"                    >> $GITHUB_ENV
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
            echo "⚠ No certificate found — using ad-hoc signing (won't run on other Macs)."
          fi

      # Set Windows signing env only when the cert secret is actually configured.
      # Passing an empty WIN_CSC_LINK causes electron-builder to resolve it as
      # a relative path (the workspace root), which breaks the build.
      # Note: 'secrets' context cannot be used in step 'if:' expressions,
      # so we pass secrets as env vars and check them inside the script.
      - name: Configure Windows code signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          _WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          _WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:_WIN_CSC_LINK)) {
            "WIN_CSC_LINK=$($env:_WIN_CSC_LINK)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WIN_CSC_KEY_PASSWORD=$($env:_WIN_CSC_KEY_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Windows code signing configured."
          } else {
            Write-Host "No Windows certificate found — building unsigned."
          }

      - name: Build, package & publish
        env:
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

  # Publish the draft only after all platform builds uploaded their assets.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
